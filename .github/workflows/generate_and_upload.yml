name: Genera songs.json y sube Firebase

# Los songs-vX.json NO se commitean desde aquí: en CI el fichero generado solo
# vive en el runner y se sube a Firebase (única fuente de verdad para la app).
# Si quieres guardar una versión en el repo, hazlo desde el admin
# (Otros > JSON de canciones > «Guardar versión nueva en el repo»).

on:
  push:
    branches: [main]
    paths:
      - 'songs/**'
      - '!songs/songs-v*.json'

permissions:
  contents: read

# Mismo grupo que «Sincroniza cambios en Firebase»: dos subidas seguidas (o una
# subida y un sync) no se pisan escribiendo 'songs/data' a la vez. Sin cancelar
# la que está en curso, para no dejar una subida a medias.
concurrency:
  group: songs-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate songs JSON
        run: python scripts/crear_songs_json.py
      - name: Upload to Firebase
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: python scripts/update_firebase.py
